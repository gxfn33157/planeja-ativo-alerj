<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Simulado ALERJ 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="app">

  <!-- LOGIN -->
  <div id="login-screen" class="screen active">
    <div class="center-box">
      <h1>Simulado ALERJ 2026</h1>
      <input id="username" placeholder="Usuário">
      <input id="password" type="password" placeholder="Senha">
      <button class="primary" onclick="login()">Entrar</button>
      <p id="login-msg"></p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-screen" class="screen">
    <div class="center-box">
      <h2>Bem-vindo, <span id="user-display"></span></h2>
      <button class="primary" onclick="startSimulado()">Iniciar Simulado</button>
      <button class="secondary" onclick="logout()">Sair</button>
    </div>
  </div>

  <!-- SIMULADO -->
  <div id="simulado-screen" class="screen">
    <div class="simulado-box">
      <div id="contador"></div>
      <h3 id="pergunta"></h3>
      <div id="alternativas"></div>

      <div class="simulado-botoes">
        <button onclick="anterior()">Anterior</button>
        <button onclick="proxima()">Próxima</button>
        <button class="primary" onclick="finalizar()">Finalizar</button>
      </div>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultado-screen" class="screen">
    <div class="resultado-box">
      <h2>Resultado Final</h2>
      <p id="pontuacao"></p>
      <div id="resultado-detalhado"></div>
      <button class="primary" onclick="voltarDashboard()">Voltar</button>
    </div>
  </div>

</div>

<script src="/script.js"></script>
</body>
</html>
