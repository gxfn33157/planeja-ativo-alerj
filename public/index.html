<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Simulado ALERJ 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
  <h1>Simulado ALERJ 2026</h1>
  <button onclick="iniciar()">Iniciar Simulado</button>
</div>

<div id="simulado" class="hidden">
  <div class="topo">
    <span id="contador"></span>
    <button onclick="sair()">Sair</button>
  </div>

  <h2 id="pergunta"></h2>
  <div id="alternativas"></div>

  <div class="acoes">
    <button onclick="anterior()">Anterior</button>
    <button onclick="proxima()">Próxima</button>
  </div>

  <button class="finalizar" onclick="finalizar()">Finalizar Simulado</button>
</div>

<div id="resultado" class="hidden">
  <h1>Resultado</h1>
  <h2 id="nota"></h2>
  <div id="analise"></div>
  <button onclick="reiniciar()">Voltar ao Início</button>
</div>

<script src="script.js"></script>
</body>
</html>
