<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Simulado ALERJ 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="titulo">Simulado ALERJ 2026</h1>

<button id="btnIniciar" onclick="iniciar()">Iniciar Simulado</button>

<div id="simulado" class="hidden">
  <div class="topo">
    <span id="contador"></span>
    <button onclick="finalizar()">Finalizar</button>
  </div>

  <h2 id="pergunta"></h2>
  <div id="alternativas"></div>

  <div class="acoes">
    <button onclick="anterior()">Anterior</button>
    <button onclick="proxima()">Próxima</button>
  </div>
</div>

<div id="resultado" class="hidden">
  <h2>Resultado</h2>
  <p id="nota"></p>

  <h3>Conteúdos para revisar</h3>
  <div id="analise"></div>

  <h3>Histórico</h3>
  <ul id="historico"></ul>

  <h3>Ranking</h3>
  <ol id="ranking"></ol>

  <button onclick="reiniciar()">Novo Simulado</button>
</div>

<script src="script.js"></script>
</body>
</html>
