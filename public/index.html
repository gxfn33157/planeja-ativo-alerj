<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Planeja Ativo | Simulado ALERJ 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="screen">
  <div class="card login-card">
    <h1>Planeja Ativo</h1>
    <p>Simulados ALERJ 2026</p>

    <input id="loginUsuario" placeholder="Usuário">
    <input id="loginSenha" type="password" placeholder="Senha">

    <button id="btnLogin">Entrar</button>
    <p id="loginMsg" class="error"></p>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <header>
    <h2>Bem-vindo, <span id="nomeUsuario"></span></h2>
    <button onclick="logout()">Sair</button>
  </header>

  <main>
    <button class="primary" onclick="iniciarSimulado()">Iniciar Simulado</button>

    <section id="simulado" class="hidden">
      <div class="progress">
        <span id="contador"></span>
      </div>

      <h3 id="pergunta"></h3>

      <div id="opcoes" class="opcoes"></div>

      <div class="acoes">
        <button onclick="anteriorQuestao()">Anterior</button>
        <button onclick="proximaQuestao()">Próxima</button>
        <button class="danger" onclick="finalizarSimulado()">Finalizar</button>
      </div>
    </section>

    <section id="resultado" class="hidden"></section>

    <section>
      <h3>Estatísticas por Matéria</h3>
      <ul id="estatisticas"></ul>
    </section>

    <section>
      <h3>Histórico</h3>
      <ul id="historico"></ul>
    </section>

    <section>
      <h3>Ranking</h3>
      <ul id="ranking"></ul>
    </section>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
