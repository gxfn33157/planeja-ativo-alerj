<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Planeja Ativo – ALERJ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
  <h1>Planeja Ativo – ALERJ</h1>

  <input id="loginUsuario" placeholder="Usuário">
  <input id="loginSenha" type="password" placeholder="Senha">
  <button id="btnLogin">Entrar</button>

  <p id="loginMsg"></p>
</div>

<div id="app" style="display:none;">
  <h2>Bem-vindo, <span id="nomeUsuario"></span></h2>

  <button onclick="iniciarSimulado()">Iniciar Simulado</button>

  <div id="quiz" style="display:none;">
    <h3 id="pergunta"></h3>
    <div id="opcoes"></div>
    <button onclick="proximaQuestao()">Próxima</button>
  </div>

  <div id="resultado"></div>

  <h3>Estatísticas por Matéria</h3>
  <ul id="estatisticas"></ul>

  <h3>Histórico</h3>
  <ul id="historico"></ul>

  <h3>Ranking</h3>
  <ul id="ranking"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
