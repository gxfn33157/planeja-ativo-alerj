<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Planeja Ativo - ALERJ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login">
  <h1>Planeja Ativo</h1>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <p id="msg"></p>
</div>

<div id="app" style="display:none;">
  <h2>Olá, <span id="user"></span></h2>
  <button onclick="iniciar()">Iniciar Simulado</button>

  <div id="quiz" style="display:none;">
    <h3 id="pergunta"></h3>
    <div id="opcoes"></div>
    <button onclick="proxima()">Próxima</button>
  </div>

  <div id="resultado"></div>

  <h3>Histórico</h3>
  <ul id="historico"></ul>

  <h3>Ranking</h3>
  <ul id="ranking"></ul>
</div>

<script src="/script.js"></script>
</body>
</html>
