<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Planeja Ativo ALERJ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="login-box">
    <h2>Planeja Ativo ALERJ</h2>

    <input id="username" placeholder="Usuário" />
    <input id="password" type="password" placeholder="Senha" />

    <button onclick="login()">Entrar</button>
    <button class="secondary" onclick="register()">Criar conta</button>

    <p id="login-msg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-screen" class="screen active">
  <div class="center-box">
    <h1>Simulado ALERJ 2026</h1>
    <button class="primary" onclick="iniciarSimulado()">
      Iniciar Simulado
    </button>
  </div>
</div>

<!-- SIMULADO -->
<div id="simulado-screen" class="screen">
  <div class="container">
    <h3 id="q-number"></h3>
    <p id="q-text"></p>

    <div id="q-options"></div>

    <div style="margin-top:20px">
      <button class="secondary" onclick="prevQuestion()">Voltar</button>
      <button onclick="nextQuestion()">Próxima</button>
      <button class="secondary" onclick="irParaPendente()">Pendente</button>
      <button onclick="finishSimulado()">Finalizar</button>
    </div>
  </div>
</div>

<!-- RESULTADO -->
<div id="result-screen" class="screen">
  <div class="container">
    <h2>Resultado Final</h2>
    <p>Nota: <strong id="score-val"></strong> / <span id="total-val"></span></p>

    <h3>Desempenho por Matéria</h3>
    <ul id="subject-list"></ul>

    <button onclick="showDashboard()">Voltar ao Dashboard</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
